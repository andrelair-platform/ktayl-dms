name: CI (indra-ocr)

# The DMS scan/image OCR service (ADR-002). Python/FastAPI, Tier-D-ish tooling service:
#   L0 lint       — ruff + mypy
#   L1 test-unit  — pytest tests/unit (indra mocked, fast, no model)
#   smoke         — pytest tests/smoke (the REAL indra API shape; downloads the model)
#   build-push    — dual-push Harbor(dev)+ghcr(prod) + Trivy + cosign/SBOM (main only)
# Model is baked into the image at build time (default-deny-egress cluster — no runtime HF fetch).

on:
  push:
    branches: [main]
    paths: ["indra-ocr/**", ".github/workflows/ci-indra-ocr.yml"]
  pull_request:
    branches: [main]
    paths: ["indra-ocr/**", ".github/workflows/ci-indra-ocr.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY:   harbor.10.0.0.200.nip.io
  IMAGE_NAME: library/indra-ocr
  GHCR_IMAGE: ghcr.io/andrelair-platform/indra-ocr

defaults:
  run:
    working-directory: indra-ocr

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[test]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .

  test-unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[test]"
      - run: pytest tests/unit -q

  test-smoke:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[test]"
      # Validates app.ocr against the REAL indra library (downloads the ~76 MB model).
      - run: pytest tests/smoke -q

  build-and-push:
    needs: [lint, test-unit, test-smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Compute build metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          TAG="${SHA}"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          HARBOR_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          TAGS="${HARBOR_REF}"$'\n'"${{ env.GHCR_IMAGE }}:${TAG}"
          { echo "tags<<EOF"; echo "${TAGS}"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          sudo mkdir -p /etc/docker/certs.d/${{ env.REGISTRY }}
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /etc/docker/certs.d/${{ env.REGISTRY }}/ca.crt
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Login to GHCR (prod images)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor.10.0.0.200.nip.io"]
              insecure = true

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: indra-ocr
          file: indra-ocr/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Scan image (Trivy — CRITICAL only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref:      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format:         table
          exit-code:      '1'
          severity:       CRITICAL
          ignore-unfixed: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Sign image + attach SBOM (keyless)
        run: |
          cosign sign --yes "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}"
          syft "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}" -o cyclonedx-json=sbom.json
          cosign attach sbom --sbom sbom.json --type cyclonedx "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}"
