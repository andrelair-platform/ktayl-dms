name: CI (dms-classifier)

# The DMS document classifier (spec-dms-classifier). Python/async worker:
#   L0 lint       — ruff + mypy
#   L1 test-unit  — pytest tests/unit (the decision gates, the parser, the PII fail-closed)
#   build-push    — dual-push Harbor(dev)+ghcr(prod) + Trivy + cosign/SBOM (main only)

on:
  push:
    branches: [main]
    paths: ["classifier/**", ".github/workflows/ci-classifier.yml"]
  pull_request:
    branches: [main]
    paths: ["classifier/**", ".github/workflows/ci-classifier.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/andrelair-platform/dms-classifier

defaults:
  run:
    working-directory: classifier

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[test]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app

  test-unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[test]"
      - run: pytest tests/unit -q

  build-and-push:
    needs: [lint, test-unit]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Compute build metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "image_tag=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tags=${{ env.GHCR_IMAGE }}:${SHA}" >> "$GITHUB_OUTPUT"

      # Harbor retirement (docs/harbor-retirement.md): ghcr-ONLY now (the Harbor dual-push is removed —
      # it was the reason this image never built during the Harbor outage). No Tailscale/CA/Harbor login.
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: classifier
          file: classifier/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Scan image (Trivy — CRITICAL only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref:      ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
          format:         table
          exit-code:      '1'
          severity:       CRITICAL
          ignore-unfixed: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Sign image + attach SBOM (keyless)
        run: |
          cosign sign --yes "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}"
          syft "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}" -o cyclonedx-json=sbom.json
          cosign attach sbom --sbom sbom.json --type cyclonedx "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}"
