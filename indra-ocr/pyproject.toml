[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indra-ocr-service"
version = "0.1.0"
description = "Self-hosted CPU OCR microservice (indra) for the ktayl DMS (#24)"
requires-python = ">=3.12"
dependencies = [
  "indra-ocr==1.1.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.11",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = false

# indra_ocr / cv2 ship no type stubs — don't fail the type gate on third-party imports.
[[tool.mypy.overrides]]
module = ["indra_ocr.*", "cv2.*", "numpy.*"]
ignore_missing_imports = true
